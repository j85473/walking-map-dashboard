name: Verify Walking Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walking-dashboard-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: bash -n scripts/deployment/*.sh
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:1/career_db?schema=walking_map
